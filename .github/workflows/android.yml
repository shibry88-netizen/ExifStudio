name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 固定签名：同一把证书，后续版本可覆盖安装，不必卸载重装
      - name: Restore signing keystore
        run: base64 -d keystore/release.jks.b64 > keystore/release.jks

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify signature
        if: success()
        shell: bash
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/ExifStudio-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExifStudio-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # 失败时把关键报错写回仓库（ci-report.txt），便于直接定位
      - name: Publish failure report
        if: failure()
        shell: python
        run: |
          import os
          import re

          log = ""
          if os.path.exists("build.log"):
              log = open("build.log", encoding="utf-8", errors="ignore").read()

          lines = log.splitlines()
          keep = [l for l in lines if re.search(r"^e: |error:|FAILURE:|Caused by:|^> ", l)]
          if not keep:
              keep = lines[-150:]
          report = "\n".join(keep[:250]) or "no build.log produced"

          with open("ci-report.txt", "w", encoding="utf-8") as f:
              f.write(report)
          print(report[:2000])

      - name: Commit failure report
        if: failure()
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add ci-report.txt || true
          git commit -m "ci: build failure report [skip ci]" || true
          git push || true
