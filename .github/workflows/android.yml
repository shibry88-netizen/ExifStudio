name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 固定签名：同一把证书，后续版本可覆盖安装，不必卸载重装
      - name: Restore signing keystore
        run: base64 -d keystore/release.jks.b64 > keystore/release.jks

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify signature
        if: success()
        shell: bash
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/ExifStudio-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExifStudio-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # 失败时把关键报错写进 Issue，方便直接定位
      - name: Report failure to issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -E "^e: |error:|FAILURE:|Caused by:" build.log | head -60 || true)
          if [ -z "$ERRORS" ]; then ERRORS=$(tail -c 3500 build.log); fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI failed: ${GITHUB_SHA::7}" \
            --body "$(printf 'Commit: %s\n\n```\n%s\n```\n' "$GITHUB_SHA" "$ERRORS")" || true
          echo "$ERRORS"
